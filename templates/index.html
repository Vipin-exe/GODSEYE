<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GODSEYE - Malware Analysis Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Oswald:wght@600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --neon-pink: #ff0055;
            --neon-cyan: #00ffcc;
            --black: #000000;
            --dark: #0a0a0a;
            --white: #ffffff;
            --grey: #aaaaaa;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--black);
            background-image: url("{{ url_for('static', filename='bg.jpg') }}");
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            font-family: 'Share Tech Mono', monospace;
            color: var(--white);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 580px;
            padding: 2rem;
        }

        .card {
            background: rgba(0, 0, 0, 0.92);
            border: 2px solid var(--neon-pink);
            border-radius: 0;
            padding: 2.5rem 2rem;
            box-shadow: 0 0 30px rgba(255, 0, 85, 0.5), inset 0 0 60px rgba(0,0,0,0.5);
            position: relative;
        }

        /* Corner decorations */
        .card::before, .card::after {
            content: '';
            position: absolute;
            width: 16px;
            height: 16px;
            border-color: var(--neon-pink);
            border-style: solid;
        }
        .card::before { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
        .card::after  { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }

        .header { text-align: center; margin-bottom: 2rem; }

        .logo {
            font-family: 'Oswald', sans-serif;
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 8px;
            color: var(--neon-pink);
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(255,0,85,0.8), 0 0 30px rgba(255,0,85,0.4);
            animation: glitch 4s infinite;
        }

        @keyframes glitch {
            0%, 90%, 100% { text-shadow: 0 0 10px rgba(255,0,85,0.8), 0 0 30px rgba(255,0,85,0.4); transform: skew(0deg); }
            92% { transform: skew(-2deg); text-shadow: -3px 0 var(--neon-cyan), 3px 0 var(--neon-pink); }
            94% { transform: skew(2deg); text-shadow: 3px 0 var(--neon-cyan), -3px 0 var(--neon-pink); }
            96% { transform: skew(0deg); }
        }

        .subtitle {
            color: var(--grey);
            font-size: 0.8rem;
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 0.4rem;
        }

        .divider {
            border: none;
            border-top: 1px solid var(--neon-pink);
            margin: 1.5rem 0;
            box-shadow: 0 0 6px rgba(255, 0, 85, 0.5);
        }

        .terminal-label {
            font-size: 0.7rem;
            letter-spacing: 3px;
            color: var(--neon-pink);
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .upload-area {
            border: 1px dashed rgba(255, 0, 85, 0.5);
            padding: 2.5rem 1.5rem;
            text-align: center;
            cursor: pointer;
            position: relative;
            transition: all 0.2s;
            background: rgba(255, 0, 85, 0.03);
            margin-bottom: 1.5rem;
        }

        .upload-area:hover, .upload-area.dragover {
            border-color: var(--neon-pink);
            background: rgba(255, 0, 85, 0.08);
            box-shadow: 0 0 15px rgba(255, 0, 85, 0.3);
        }

        input[type="file"] {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%; opacity: 0; cursor: pointer;
        }

        .upload-icon { font-size: 2rem; display: block; margin-bottom: 0.8rem; }

        .upload-area h3 {
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            letter-spacing: 2px;
            color: var(--white);
            font-weight: normal;
        }

        .upload-area p {
            font-size: 0.75rem;
            color: var(--grey);
            margin-top: 0.4rem;
        }

        .filename-display {
            margin-top: 1rem;
            color: var(--neon-cyan);
            font-size: 0.8rem;
            letter-spacing: 1px;
        }

        .flashes { list-style: none; color: var(--neon-pink); margin-bottom: 1rem; font-size: 0.85rem; }

        .btn {
            display: block;
            width: 100%;
            background: var(--neon-pink);
            color: var(--black);
            border: none;
            padding: 1rem;
            font-family: 'Oswald', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            letter-spacing: 6px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.2s;
            border-radius: 0;
        }

        .btn:hover {
            background: var(--black);
            color: var(--neon-pink);
            box-shadow: inset 0 0 0 2px var(--neon-pink), 0 0 20px rgba(255,0,85,0.5);
        }

        .blink { animation: blink 1s step-end infinite; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo">GODSEYE</div>
                <div class="subtitle">Malware Identification System<span class="blink">_</span></div>
            </div>

            <hr class="divider">

            {% with messages = get_flashed_messages() %}
              {% if messages %}
                <ul class="flashes">
                {% for message in messages %}
                  <li>&gt; ERROR: {{ message }}</li>
                {% endfor %}
                </ul>
              {% endif %}
            {% endwith %}

            <div class="terminal-label">&gt; Upload Target File</div>

            <form action="{{ url_for('analyze') }}" method="post" enctype="multipart/form-data">
                <div class="upload-area" id="drop-zone">
                    <span class="upload-icon">⬡</span>
                    <h3>DRAG &amp; DROP FILE</h3>
                    <p>// or click to browse filesystem</p>
                    <input type="file" name="file" id="file-input" required>
                    <div class="filename-display" id="filename-display"></div>
                </div>

                <button type="submit" class="btn">Analyze Target</button>
            </form>
        </div>
    </div>

    <script>
        const fileInput = document.getElementById('file-input');
        const filenameDisplay = document.getElementById('filename-display');
        const dropZone = document.getElementById('drop-zone');

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                filenameDisplay.textContent = '> ' + e.target.files[0].name;
            }
        });

        ['dragenter','dragover','dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, e => { e.preventDefault(); e.stopPropagation(); }));
        ['dragenter','dragover'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.add('dragover')));
        ['dragleave','drop'].forEach(ev => dropZone.addEventListener(ev, () => dropZone.classList.remove('dragover')));

        dropZone.addEventListener('drop', e => {
            let files = e.dataTransfer.files;
            fileInput.files = files;
            if (files.length > 0) filenameDisplay.textContent = '> ' + files[0].name;
        });
    </script>
</body>
</html>
