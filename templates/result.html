<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analysis Result - Nexus</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
            --primary: #3b82f6;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --danger: #ef4444;
            --success: #10b981;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; }

        body {
            background: var(--bg);
            background-image: 
                radial-gradient(at 0% 0%, rgba(59, 130, 246, 0.15) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(16, 185, 129, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 800px;
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .header { text-align: center; margin-bottom: 3rem; }
        .header h1 { font-size: 2rem; font-weight: 800; margin-bottom: 0.5rem; }
        .header p { color: var(--text-muted); }

        .result-box {
            text-align: center;
            padding: 2rem;
            border-radius: 16px;
            margin-bottom: 3rem;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
        }

        .result-title { font-size: 1.2rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-muted); margin-bottom: 1rem; }
        .result-value { font-size: 4rem; font-weight: 800; line-height: 1; margin-bottom: 0.5rem; }
        
        .malware { color: var(--danger); text-shadow: 0 0 40px rgba(239, 68, 68, 0.4); }
        .benign { color: var(--success); text-shadow: 0 0 40px rgba(16, 185, 129, 0.4); }

        .features-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 3rem;
        }

        .feature-card {
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 1.5rem;
            border-radius: 12px;
        }

        .feature-name { font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.5rem; word-break: break-all; }
        .feature-value { font-size: 1.5rem; font-weight: 600; }

        .btn {
            display: inline-block;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            text-decoration: none;
            padding: 1rem 2rem;
            border-radius: 12px;
            font-weight: 600;
            transition: all 0.3s;
            text-align: center;
            width: 100%;
        }

        .btn:hover { background: rgba(255, 255, 255, 0.2); transform: translateY(-2px); }
    </style>
</head>
<body>
    <div class="container">
        <div class="glass-card">
            <div class="header">
                <h1>Analysis Report</h1>
                <p>File: <strong>{{ filename }}</strong></p>
            </div>

            <div class="result-box">
                <div class="result-title">Classification</div>
                <div class="result-value {% if result == 'Malware' %}malware{% else %}benign{% endif %}">
                    {{ result }}
                </div>
                <p style="margin-top: 1rem; color: var(--text-muted);">Confidence Score: <strong>{{ confidence }}</strong></p>
            </div>

            <h3 style="margin-bottom: 1.5rem; color: var(--text-muted); font-weight: 600; font-size: 1.1rem;">Extracted Features</h3>
            <div class="features-grid">
                {% for key, value in features.items() %}
                <div class="feature-card">
                    <div class="feature-name">{{ key }}</div>
                    <div class="feature-value">
                        {% if value is float %}
                            {{ "%.2f"|format(value) }}
                        {% else %}
                            {{ value }}
                        {% endif %}
                    </div>
                </div>
                {% endfor %}
            </div>

            <a href="{{ url_for('index') }}" class="btn">Analyze Another File</a>
        </div>
    </div>
</body>
</html>
